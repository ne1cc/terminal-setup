# ==============================================================================
# fleet.conf — Production Multi-Agent Worktree Orchestrator Configuration
# ==============================================================================
# This configuration file defines default settings for `fleet`.
# Locations searched (in priority order):
#   1. Custom path specified via --config <path> or $FLEET_CONFIG
#   2. <repo-root>/config/fleet.conf or <repo-root>/.config/fleet/fleet.conf
#   3. $XDG_CONFIG_HOME/fleet/fleet.conf (~/.config/fleet/fleet.conf)
# ==============================================================================

# Default list of AI agents to spawn (comma-separated)
# Supported: claude, agy, qoder (or custom named agents)
DEFAULT_AGENTS="claude,agy,qoder"

# Base dev server port. Each agent gets injected with an offset port:
#   claude: PORT_BASE + 1 (e.g. 3101)
#   agy:    PORT_BASE + 2 (e.g. 3102)
#   qoder:  PORT_BASE + 3 (e.g. 3103)
PORT_BASE=3100

# Dependency isolation strategy for new worktrees:
#   symlink : Symlinks node_modules, .venv, etc. from repository root (fastest)
#   install : Runs package managers concurrently (pnpm/npm/uv/poetry) in each worktree
#   none    : Does not link or install dependencies
DEPS_STRATEGY="symlink"

# Default Tmux layout geometry:
#   even-horizontal : 3 balanced vertical columns (recommended for widescreen)
#   main-horizontal : Top main pane + 2 bottom stacked panes
#   tiled           : Balanced grid
TMUX_LAYOUT="even-horizontal"

# Dirty workspace handling strategy:
#   prompt   : Interactively prompt the user (stash, snapshot, or abort)
#   stash    : Automatically stash uncommitted changes and restore on parent
#   snapshot : Create an ephemeral commit and branch agents without touching worktree
#   clean    : Abort if uncommitted changes exist
AUTO_STASH="prompt"

# Agent CLI Executables & Startup Flags
CLAUDE_CMD="claude"
AGY_CMD="agy --dangerously-skip-permissions"
QODER_CMD="qodercli"

# Runtime secret & environment file patterns copied to new worktrees
SECRETS_PATTERNS=".env* local.settings.json .npmrc .pypirc"

# Automatically attach to tmux session after spawning (true/false)
AUTO_ATTACH="true"

# Grace period in milliseconds to wait before injecting prompt via send-keys
PROMPT_INJECT_DELAY_MS=1500

# Starship configuration for clean git/python/environment indicators

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$conda\
$env_var\
$custom\
$line_break\
$character"""

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "  "
style = "bold magenta"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = "🐍 "
style = "bold yellow"
format = "via [$symbol$py_ver]($style) "

[conda]
symbol = "🅒 "
style = "bold green"
format = "via [$symbol$environment]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# ==============================================================================
# TMUX CONFIGURATION
# Optimized for Alacritty + Neovim + Tokyo Night palette
# Managed via GNU Stow: ~/Terminal-configs → $HOME
# ==============================================================================

# ==============================================================================
# PREFIX
# ==============================================================================
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Ensure clean UTF-8 locale environment across all panes & background scripts
set-environment -g LANG "en_US.UTF-8"
set-environment -g LC_ALL "en_US.UTF-8"
set-environment -g LC_CTYPE "en_US.UTF-8"


# ==============================================================================
# TERMINAL & COLOR SUPPORT
# ==============================================================================

# tmux-256color is correct inside tmux; Alacritty handles the outer terminal.
set -g default-terminal "tmux-256color"

# Enable true 24-bit color pass-through for xterm-style and alacritty terminals.
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",alacritty:24bit"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-features "xterm-ghostty:clipboard"

# Image passthrough support (for image.nvim & Kitty graphics protocol)
set -g allow-passthrough on

# OSC 52 clipboard sync between tmux panes and Ghostty
set -s set-clipboard on
set -ga update-environment "TERM TERM_PROGRAM"

# Cursor shape passthrough (Ss/Se) — lets Neovim switch the terminal cursor to a
# block in normal mode and a beam in insert mode instead of getting stuck.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Remove ESC delay (critical for neovim mode switching)
set -sg escape-time 0

# Pass focus events to panes (needed for neovim autoread / gitsigns refresh)
set -g focus-events on

# Extended key protocol — lets tmux request XTerm modifyOtherKeys from Alacritty
# so Ctrl+Tab, Ctrl+Shift+Tab etc. are reported as C-Tab / C-BTab natively.
set -g extended-keys on

# Cross-platform PATH: nonexistent dirs are silently ignored on every Unix
set-environment -g PATH "/data/data/com.termux/files/usr/bin:/root/.local/bin:$HOME/bin:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:/usr/bin:/bin"
set-environment -g TERMINFO_DIRS "$HOME/.terminfo:/Applications/Ghostty.app/Contents/Resources/terminfo:/usr/share/terminfo"

# Default shell to zsh across environments (Termux / Linux / macOS)
if-shell 'test -x /data/data/com.termux/files/usr/bin/zsh' \
    'set -g default-shell /data/data/com.termux/files/usr/bin/zsh' \
    'if-shell "test -x /usr/bin/zsh" "set -g default-shell /usr/bin/zsh" "set -g default-shell /bin/zsh"'


# ==============================================================================
# GENERAL BEHAVIOR
# ==============================================================================

set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi

# Keep terminal/Ghostty open when closing last pane/window of a session;
# automatically switch client to the most recently active session.
# Note: 'previous' triggers an upstream tmux 3.7b crash in sort_qsort.
set -g detach-on-destroy off

# Push session · window name to Ghostty's title bar
set -g set-titles on
set -g set-titles-string '#S · #W'

# Aggressive resize: fit to the smallest attached client only when multiple
# clients are actually looking at the same window.
setw -g aggressive-resize on

# Press Prefix + J to interactively choose a window/pane to join into the current window (Tree Switcher)
bind-key J choose-tree -Zw "join-pane -h -s '%%'"

# Activity alerts in background windows
set -g monitor-activity on
set -g visual-activity off

# Easy config reload & clear image overlays
bind-key r source-file ~/.tmux.conf \; display-message "✓ ~/.tmux.conf reloaded"
bind-key C-l run-shell 'printf "\033_Ga=d,d=A\033\\" > #{client_tty} 2>/dev/null || true' \; refresh-client \; display-message "✓ Terminal screen & image overlays cleared"

# Automatically clear ghost terminal graphics (Kitty graphics protocol) on window switch
set-hook -g after-select-window 'run-shell -b "printf \"\\033_Ga=d,d=A\\033\\\\\" > #{client_tty} 2>/dev/null || true"'


# ==============================================================================
# STATUS BAR — Tokyo Night palette, pinned to top to mimic IDE tab bar
# Mirrors Alacritty background #1a1b26 so the bar bleeds seamlessly into
# the window chrome / titlebar area.
# ==============================================================================

set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# --- Left: session name ---
# Glyphs:  nf-fa-terminal (U+F120) ·  nf-pl-right_hard_divider (U+E0B0)
set -g status-left-length 40
set -g status-left "#[bg=#7dcfff,fg=#1a1b26,bold]  #S #[bg=#1a1b26,fg=#7dcfff,nobold]#[default] "

# --- Window list (center) ---
set -g status-justify left
# Glyphs:  nf-fa-circle_o (U+F10C) inactive ·  nf-fa-circle (U+F111) active
setw -g window-status-format         "#[fg=#565f89]  #I #W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[bg=#2d3149,fg=#7dcfff,bold]  #I #W#{?window_flags,#{window_flags}, } "
setw -g window-status-activity-style "bg=colour214,fg=black,bold" # Amber flash when agent completes

# --- Right: active Claude sessions · host · date · time ---
set -g status-right-length 120
set -g status-right "#[fg=#ff9e64,bold]🤖 #(pgrep -f '[c]laude' | wc -l | tr -d ' ') active  #[fg=#565f89]#H  #[fg=#a9b1d6]%a %b %d  #[fg=#7dcfff,bold]%H:%M "

# --- Pane borders (Customization) ---
# Unfocused pane border (Subtle gray)
set -g pane-border-style fg=#555555
# Active pane border (Vibrant electric blue)
set -g pane-active-border-style fg=#7DF9FF
set -g pane-border-status top
set -g pane-border-format "#{pane_index}: #{pane_title}"

# --- Message / command line ---
# Message/Command line accent (Teal background, black text)
set -g message-style bg=#00f5d4,fg=#000000
set -g message-command-style "bg=#2d3149,fg=#bb9af7"

# --- Copy mode highlight ---
set -g mode-style "bg=#2d3149,fg=#c0caf5"


# ==============================================================================
# COPY MODE (vi)
# ==============================================================================

bind-key -T copy-mode-vi v         send-keys -X begin-selection
bind-key -T copy-mode-vi C-v       send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape    send-keys -X cancel

# Vimium-style half-page scrolling inside copy-mode
bind-key -T copy-mode-vi u         send-keys -X halfpage-up
bind-key -T copy-mode-vi d         send-keys -X halfpage-down

# Vim-style quick insert (exit copy-mode)
bind-key -T copy-mode-vi i         send-keys -X cancel

# Vimium-style fuzzy URL picker (extract URLs from screen and open)
bind-key -T copy-mode-vi f         send-keys -X cancel \; display-popup -E -w 75% -h 50% "tmux capture-pane -J -p | grep -oE '(https?|ftp|file)://[-A-Za-z0-9+&@#/%?=~_|!:,.;]*[-A-Za-z0-9+&@#/%=~_|]' | uniq | fzf --reverse --header 'Select URL to open' | xargs sh -c 'command -v termux-open >/dev/null && termux-open \"\$@\" || command -v open >/dev/null && open \"\$@\" || xdg-open \"\$@\"' _"

# Vim-style copy current line (Y)
bind-key -T copy-mode-vi Y         send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "termux-clipboard-set 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || pbcopy" \; display-message "✓ Copied line to clipboard"

# Copy + confirmation toast. copy-pipe-and-cancel pushes the selection to the
# system clipboard (xclip → xsel → pbcopy fallback), then display-message shows
# a brief "copied" popup in the status line with the byte count.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "termux-clipboard-set 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || pbcopy" \; display-message "✓ Copied #{buffer_size} bytes to clipboard"

# Mouse drag release → auto-copy on select (restores Ghostty copy-on-select)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "termux-clipboard-set 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || pbcopy" \; display-message "✓ Copied #{buffer_size} bytes to clipboard"

# How long the "copied" toast (and other messages) stays visible
set -g display-time 1200

# Quick copy-mode entry
bind-key Enter copy-mode

# Instant enter copy-mode and scroll up half-page with Prefix + u
bind-key u copy-mode \; send-keys -X halfpage-up


# ==============================================================================
# SPLITS & WINDOWS
# ==============================================================================

# Intuitive split shortcuts — always inherit current pane's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+Tab / Ctrl+Shift+Tab → cycle panes
bind-key -n C-Tab   select-pane -t :.+
bind-key -n C-BTab  select-pane -t :.-
bind-key -n C-S-Tab select-pane -t :.-

# User-defined keys for Ghostty & Alacritty escape sequences
set -s user-keys[0] "\e[27;5;9~"
set -s user-keys[1] "\e[27;6;9~"
set -s user-keys[2] "\e[27;6;72~"
set -s user-keys[3] "\e[27;6;76~"
set -s user-keys[4] "\e[27;6;104~"
set -s user-keys[5] "\e[27;6;108~"
set -s user-keys[6] "\e[72;6u"
set -s user-keys[7] "\e[76;6u"
set -s user-keys[8] "\e[104;6u"
set -s user-keys[9] "\e[108;6u"

bind-key -n User0 select-pane -t :.+
bind-key -n User1 select-pane -t :.-
bind-key -n User2 previous-window
bind-key -n User3 next-window
bind-key -n User4 previous-window
bind-key -n User5 next-window
bind-key -n User6 previous-window
bind-key -n User7 next-window
bind-key -n User8 previous-window
bind-key -n User9 next-window






# Arrow keys: physically swap/move panes in that direction
bind Left  swap-pane -d -t '{left}'
bind Down  swap-pane -d -t '{down}'
bind Up    swap-pane -d -t '{up}'
bind Right swap-pane -d -t '{right}'

# Resize panes with Prefix + Shift+hjkl (5-cell steps)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom toggle shortcut (mirrors typical IDE "maximize pane")
bind z resize-pane -Z

# Move current pane to the next window
bind-key > join-pane -t :+

# Move current pane to the previous window (for symmetry)
bind-key < join-pane -t :-

# Last-window fast toggle (Prefix + ` or Prefix + Tab)
bind-key \` last-window
bind-key Tab last-window
bind-key BTab last-window

# Toggle/switch between windows (Ctrl + Shift + H / L, Shift + Left / Right arrow, Ctrl + PageUp / PageDown)
bind-key -n C-S-h previous-window
bind-key -n C-S-H previous-window
bind-key -n C-S-l next-window
bind-key -n C-S-L next-window
bind-key C-S-h previous-window
bind-key C-S-H previous-window
bind-key C-S-l next-window
bind-key C-S-L next-window
bind-key -n S-Left previous-window
bind-key -n S-Right next-window
bind-key -n C-PageUp previous-window
bind-key -n C-PageDown next-window

# Move/swap window position in window list (Ctrl + Shift + Left / Right arrow)
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1


# Toggle status bar visibility
bind-key b set-option status


# ==============================================================================
# PANE / WINDOW MANAGEMENT
# ==============================================================================

# Prefix + g → "grab": interactive fuzzy multi-select picker with live terminal preview to join panes into current window
bind-key g display-popup -E -w 85% -h 75% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-join-panes"

# Prefix + Alt + Shift + S → prompt for source window number to join (vertical split)
# (Capital S is tmux-resurrect save — see TPM section)
bind-key M-S command-prompt -p "Join pane from window:" "join-pane -h -s ':%%'"

# Prefix + W → high-information tree with process names, PIDs, last activity
bind-key W choose-tree -Z -F "#{?pane_format,#[fg=cyan]Pane #P: #[fg=white]#[bold]#{pane_current_command} #[fg=yellow][PID #D] #[fg=green](Access: #{t/p:pane_last_activity}) #{?pane_active,#[fg=red][ACTIVE],},#[fg=magenta]Window #I #W #{?window_activity_flag,#[fg=red][ALERT: NEW OUTPUT],}}"

# Prefix + M → Join marked pane horizontally into current window
bind-key M join-pane -h -s '{marked}'

# Prefix + , → rename current window (tmux default)
bind-key , command-prompt -p "Rename window:" "rename-window '%%'"

# Prefix + . → rename current pane title (R is resurrect restore — see TPM section)
bind-key . command-prompt -p "Rename pane:" "select-pane -T '%%'"

# Kill pane/window/session with confirmation prompt (Enter or y to confirm)
bind-key x confirm-before -y -p "kill-pane #P? (y/Enter/n)" kill-pane
bind-key X confirm-before -y -p "kill-window #W? (y/Enter/n)" kill-window
bind-key & confirm-before -y -p "kill-window #W? (y/Enter/n)" kill-window
bind-key M-x confirm-before -y -p "kill-session #S? (y/Enter/n)" kill-session

# Toggle pane synchronization
bind-key y set-window-option synchronize-panes \; display-message "Panes #{?synchronize-panes,SYNCHRONIZED,DE-SYNCHRONIZED}"

# Break pane out into a new window (prefix + B)
bind-key B break-pane

# Break the active pane into its own tmux session, then open that session in a
# new native terminal. A distinct session avoids window-index renumbering races
# while preserving the pane's running process.
bind-key M-a run-shell -b 'window=$(tmux break-pane -d -s "$TMUX_PANE" -P -F "#{window_id}") && session="breakout-${TMUX_PANE#%}-$(date +%s)" && tmux new-session -d -s "$session" && tmux move-window -k -s "$window" -t "$session": && open -na Alacritty --args -e tmux attach-session -t "$session"'
bind-key M-g run-shell -b 'PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-breakout-ghostty #{pane_id}'

# Break current window out into a new session in a new native Ghostty window (prefix + @)
bind-key @ run-shell -b '\
  NEW_SESS="ghostty-$(date +%s)" ; \
  tmux new-session -d -s "$NEW_SESS" -c "#{pane_current_path}" ; \
  tmux move-window -k -s "#{session_name}:#{window_index}" -t "$NEW_SESS":1 ; \
  ghostty_bin="/Applications/Ghostty.app/Contents/MacOS/ghostty" ; \
  [ -x "$ghostty_bin" ] || ghostty_bin="$(command -v ghostty 2>/dev/null || echo ghostty)" ; \
  "$ghostty_bin" -e tmux attach-session -t "$NEW_SESS" >/dev/null 2>&1 & \
'

# Open a brand new empty Ghostty window with a new tmux session without moving any windows (prefix + M-@)
bind-key M-@ run-shell -b '\
  NEW_SESS="ghostty-$(date +%s)" ; \
  ghostty_bin="/Applications/Ghostty.app/Contents/MacOS/ghostty" ; \
  [ -x "$ghostty_bin" ] || ghostty_bin="$(command -v ghostty 2>/dev/null || echo ghostty)" ; \
  "$ghostty_bin" -e tmux new-session -s "$NEW_SESS" >/dev/null 2>&1 & \
'

# Break current window out into a brand-new tmux session in-place (prefix + Alt + w / M-w or prefix + Ctrl + w)
bind-key M-w command-prompt -I "#W" -p "Break window to new session name:" "run-shell 'sess=\"%%\" ; [ -z \"\$sess\" ] && sess=\"#W\" ; tmux new-session -d -s \"\$sess\" -c \"#{pane_current_path}\" && tmux move-window -k -s \"#{session_name}:#{window_index}\" -t \"\$sess\":1 && tmux switch-client -t \"\$sess\"'"
bind-key C-w command-prompt -I "#W" -p "Break window to new session name:" "run-shell 'sess=\"%%\" ; [ -z \"\$sess\" ] && sess=\"#W\" ; tmux new-session -d -s \"\$sess\" -c \"#{pane_current_path}\" && tmux move-window -k -s \"#{session_name}:#{window_index}\" -t \"\$sess\":1 && tmux switch-client -t \"\$sess\"'"

# Break active pane out into a brand-new tmux session in-place (prefix + Alt + p / M-p)
bind-key M-p command-prompt -I "#{b:pane_current_path}" -p "Break pane to new session name:" "run-shell 'window=\$(tmux break-pane -d -s \"\$TMUX_PANE\" -P -F \"#{window_id}\") && sess=\"%%\" && [ -z \"\$sess\" ] && sess=\"pane-\$(date +%s)\" && tmux new-session -d -s \"\$sess\" && tmux move-window -k -s \"\$window\" -t \"\$sess\":1 && tmux switch-client -t \"\$sess\"'"


# Break active pane to background window (prefix + Alt + Shift + B / M-B)
bind-key M-B break-pane -d

# Promote all other panes in the current window to background windows (prefix + Alt + b / M-b)
bind-key M-b run-shell 'current_pane=$(tmux display-message -p "#D"); for p in $(tmux list-panes -F "#D"); do [ "$p" != "$current_pane" ] && tmux break-pane -d -s $p; done'

# Pull all panes from a specified window (prefix + Alt + j / M-j)
bind-key -r M-j command-prompt -p "Pull all panes from window:" "run-shell 'for p in \$(tmux list-panes -t :%% -F \"#D\"); do tmux join-pane -s \$p; done; tmux select-layout tiled'"

# Push all panes of this window to another window (prefix + Alt + m / M-m)
bind-key -r M-m command-prompt -p "Push all panes to window:" "run-shell 'current_pane=\$(tmux display-message -p \"#D\"); for p in \$(tmux list-panes -F \"#D\"); do [ \"\$p\" != \"\$current_pane\" ] && tmux join-pane -s \$p -t :%%; done; tmux join-pane -s \$current_pane -t :%%; tmux select-layout -t :%% tiled'"

# Toggle pane borders visibility (moved from B to Ctrl-b because B is now break-pane)
bind-key C-b set-option -g pane-border-status \; display-message "Pane borders #{?pane-border-status,ENABLED,DISABLED}"

# Centered lazygit popup frame
bind-key C-g display-popup -d "#{pane_current_path}" -E -w 90% -h 90% "lazygit"


# ==============================================================================
# SESSION MANAGEMENT & AUTOMATION
# ==============================================================================

# Prefix + N → new named session
bind-key N command-prompt -p "New session name:" "new-session -s '%%'"

# ==============================================================================
# WINDOW "STASHING" — move a window to a background "stash" session without
# closing it (the job inside keeps running), then pull it back later.
# ==============================================================================

# Prefix + Alt-s → stash the current window into the background "stash" session
# (created on demand). Native equivalent: Prefix + . then type "stash:".
bind-key M-s run-shell 'tmux has-session -t stash 2>/dev/null || tmux new-session -ds stash -n scratch; tmux move-window -t stash:'

# Prefix + Alt-r → unstash ("retrieve"): fuzzy-pick a window out of "stash" and
# move it back into the current session. NOTE: this is deliberately not M-u —
# TPM binds prefix+M-u itself (clean unused plugins) and its `run` at the
# bottom of this file would clobber a binding on that key.
# Native equivalent: switch to "stash", then Prefix + : and run
# "join-pane -t <session>:".
bind-key M-r display-popup -E -w 60% -h 40% "tmux list-windows -t stash -F '#I: #W' 2>/dev/null | fzf --reverse --header='Unstash window' | cut -d: -f1 | xargs -I{} tmux move-window -s stash:{} -t #{session_name}:"

# ==============================================================================
# WINDOW & SESSION PICKERS (choose-tree & fzf)
# ==============================================================================

# Prefix + s → fuzzy-pick and switch to any active session (fzf popup)
bind-key s display-popup -E -w 50% -h 40% "tmux list-sessions -F '#S' | fzf --reverse --header='Switch session' | xargs tmux switch-client -t"

# Prefix + w → interactive tree/window picker (zoomed, sessions & windows, collapsed panes)
bind-key w choose-tree -Zw

# Prefix + e → fuzzy-pick and switch to any pane (live scrollback preview)
bind-key e display-popup -E -w 85% -h 75% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-switch-pane"

# ==============================================================================
# SEAMLESS VIM / NEOVIM PANE NAVIGATION (vim-tmux-navigator)
# Ctrl-h/j/k/l move between tmux panes AND Neovim splits with one muscle-memory
# keybinding — passes the keystroke through to Neovim when it's the foreground
# process, otherwise moves the tmux pane focus. Requires escape-time 0 (set
# above) and the christoomey/vim-tmux-navigator plugin on the Neovim side.
# ==============================================================================

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ==============================================================================
# GIT WORKTREE + CLAUDE SESSION WORKFLOW
# ==============================================================================

# Prefix + C-n → prompt for branch, create worktree sibling dir, open new window with claude
bind-key C-n command-prompt -p "New worktree branch:" \
  "new-window -c '#{pane_current_path}' -n '%1' 'zsh -ic \"wt-new %1; exec zsh\"'"

# Prefix + Alt + n → Fast Worktree + Claude interactive modal launcher
bind-key M-n display-popup -d "#{pane_current_path}" -E -w 65% -h 45% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-workmux-new"

# Prefix + C-a → fzf-pick existing worktree in a popup → opens new window with claude
bind-key C-a display-popup -E -w 70% -h 50% "zsh -ic 'wt-tmux-attach'"

# Prefix + C-x → fzf-pick a worktree to remove (removes dir + deletes branch)
bind-key C-x display-popup -E -w 70% -h 50% "zsh -ic 'wt-rm'"

# Prefix + w → Workmux TUI dashboard popup
bind-key w display-popup -E -w 85% -h 75% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH workmux dashboard"

# Prefix + Alt + W → Workmux live sidebar toggle
bind-key M-W run-shell "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH workmux sidebar"

# Prefix + o → Sesh + FZF Worktree Session Picker
bind-key o display-popup -E -w 70% -h 60% "TERMINFO_DIRS=$HOME/.terminfo:/Applications/Ghostty.app/Contents/Resources/terminfo:/usr/share/terminfo PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH sesh connect \"\$(sesh list --icons | fzf --no-sort --ansi --border-label ' Agent Worktrees ' --prompt '⚡ ')\""

# Prefix + a → Open or re-attach to a persistent centered Claude popup session
bind-key a display-popup -d "#{pane_current_path}" -E -w 85% -h 85% "tmux attach-session -t claude-popup || tmux new-session -s claude-popup 'claude'"

# Prefix + Alt + y → Open or re-attach to a persistent centered Antigravity YOLO popup session
bind-key M-y display-popup -d "#{pane_current_path}" -E -w 85% -h 85% "tmux attach-session -t agyy-popup || tmux new-session -s agyy-popup 'agy --dangerously-skip-permissions'"

# Prefix + / → Interactive Command Palette HUD (all workflows at your fingertips)
bind-key / display-popup -E -w 85% -h 70% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-palette"

# Prefix + O → Screen File & Stacktrace Jumper (jump directly to file:line in Neovim)
bind-key O display-popup -E -w 80% -h 60% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-open-path"

# Prefix + Alt + i → Instant Floating Scratchpad & Notes Modal
bind-key M-i display-popup -E -w 85% -h 80% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-scratchpad"

# Prefix + C-p → Open or re-attach to a project-specific Claude popup session (MD5 based)
bind-key C-p run-shell ' \
  dir_hash=$(echo -n "#{pane_current_path}" | md5sum | cut -c1-6 2>/dev/null || echo -n "#{pane_current_path}" | md5 | cut -c1-6 2>/dev/null || echo "default"); \
  session_name="claude-${dir_hash}"; \
  tmux display-popup -d "#{pane_current_path}" -E -w 85% -h 85% "tmux attach-session -t $session_name || tmux new-session -s $session_name \"claude\"" \
'

# Prefix + A → Open a side-by-side pane running Claude (35% width split)
bind-key A split-window -h -l 35% -c "#{pane_current_path}" "claude"

# Prefix + C-c → Spawn a new window running Claude in the current pane's directory
bind-key C-c new-window -c "#{pane_current_path}" -n "Claude" "claude"

# Prefix + Y / Prefix + M-Y / Prefix + C-y → Open a side-by-side pane running Antigravity YOLO (35% width split)
bind-key Y split-window -h -l 35% -c "#{pane_current_path}" "agyy"
bind-key M-Y split-window -h -l 35% -c "#{pane_current_path}" "agyy"
bind-key C-y new-window -c "#{pane_current_path}" -n "Antigravity" "agyy"


# Prefix + F → Fuzzy-find a file name and copy its path to the system clipboard
bind-key F display-popup -d "#{pane_current_path}" -E -w 75% -h 60% "zsh -c 'file=\$(fzf) && [ -n \"\$file\" ] && (termux-clipboard-set 2>/dev/null || echo -n \"\$file\" | xclip -selection clipboard 2>/dev/null || echo -n \"\$file\" | xsel --clipboard --input 2>/dev/null || echo -n \"\$file\" | pbcopy) && tmux display-message \"✓ Copied \$file to clipboard\"'"

# Prefix + d → detach (default), but also keep a "detach all others" binding
# Detach all other clients (Capital D is dev workspace layout — see 10X section)
bind-key M-d detach-client -a

# Prefix + $ → rename current session
bind-key '$' command-prompt -p "Rename session:" "rename-session '%%'"

# Kill all panes except the current one (with confirmation, Enter or y to confirm)
bind -r G confirm-before -y -p "kill all other panes in #W? (y/Enter/n)" "kill-pane -a"

# Post-Prod Archive: Capture pane history and save to a timestamped log file
bind-key P \
    capture-pane -S -30000 \; \
    save-buffer "${HOME}/tmux_archive_#{session_name}_%Y%m%d_%H%M%S.log" \; \
    delete-buffer \; \
    display-message "Pane history archived to ~/tmux_archive_#{session_name}_*.log"


# ==============================================================================
# AUTOMATIC PANE LOGGING — always-on, every pane
# ==============================================================================
# Every pane streams a full copy of its output to ~/tmux-logs from the moment
# it is created. pipe-pane format-expands #{...} against the target pane, while
# $(date ...) is evaluated once by the shell when the pipe opens, so each file
# name encodes session-window.pane + a creation timestamp and never collides.
# The -o flag makes this idempotent: a pane that is already being piped is left
# alone, so re-sourcing this config or resurrect/continuum restores won't create
# duplicate pipes. Logs are append (>>) so a re-attached pane keeps one file.
#
# This complements (does not replace) the manual prefix+P archive above and the
# tmux-logging plugin's on-demand captures below.
set-hook -g after-new-session  'pipe-pane -o "mkdir -p ~/tmux-logs && cat >> ~/tmux-logs/auto-#{session_name}-#{window_index}.#{pane_index}-$(date +%Y%m%dT%H%M%S).log"'
set-hook -g after-new-window   'pipe-pane -o "mkdir -p ~/tmux-logs && cat >> ~/tmux-logs/auto-#{session_name}-#{window_index}.#{pane_index}-$(date +%Y%m%dT%H%M%S).log"'
set-hook -g after-split-window 'pipe-pane -o "mkdir -p ~/tmux-logs && cat >> ~/tmux-logs/auto-#{session_name}-#{window_index}.#{pane_index}-$(date +%Y%m%dT%H%M%S).log"'


# ==============================================================================
# MODERN 10X WORKFLOW INTEGRATIONS
# ==============================================================================

# 1. Fuzzy Project Switcher (Tmux Sessionizer & Sesh Picker)
# Bound to Prefix + f (tmux-sessionizer) and Prefix + s (sesh smart session picker)
bind-key f display-popup -E -w 80% -h 60% "TERMINFO_DIRS=$HOME/.terminfo:/Applications/Ghostty.app/Contents/Resources/terminfo:/usr/share/terminfo PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-sessionizer"
bind-key s display-popup -E -w 80% -h 65% "TERMINFO_DIRS=$HOME/.terminfo:/Applications/Ghostty.app/Contents/Resources/terminfo:/usr/share/terminfo PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/sesh-picker"

# 2. Smart Layout-Aware Pane Splitting
# Splits horizontally if width is large, else vertically
bind-key v run-shell "if [ \$(tmux display -p '#{window_width}') -gt \$(expr \$(tmux display -p '#{window_height}') \* 2) ]; then tmux split-window -h -c '#{pane_current_path}'; else tmux split-window -v -c '#{pane_current_path}'; fi"

# 3. Focus Dimming (Fade out inactive panes slightly to enhance visual hierarchy)
set -g window-style 'fg=#7a849a,bg=default'
set -g window-active-style 'fg=#c0caf5,bg=default'

# 4. Interactive Telemetry & Process Killer Modals
bind-key T display-popup -E -w 90% -h 85% "btop 2>/dev/null || htop 2>/dev/null || top"
bind-key K display-popup -E -w 70% -h 60% "zsh -ic 'fkill'"

# 5. Declarative Workspace Launcher (Prefix + D → Dev, Prefix + Alt + D → Triage)
bind-key D run-shell "$HOME/bin/tmux-workspace dev"
bind-key M-D run-shell "$HOME/bin/tmux-workspace triage"

# 6. Multi-Agent Matrix & Session Handoff
bind-key C-t display-popup -E -w 75% -h 50% "PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-agent-matrix"
bind-key H run-shell "$HOME/bin/session-handoff"

# 7. Fuzzy Remote & Container Jumper Modals
bind-key C-d display-popup -E -w 85% -h 60% "zsh -ic 'fdocker'"
bind-key C-h display-popup -E -w 60% -h 50% "zsh -ic 'fssh'"

# 8. Ports Inspector, Cheat Sheet, and Dotfiles HUD
bind-key M-k display-popup -E -w 85% -h 65% "PATH=/data/data/com.termux/files/usr/bin:/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-ports"
bind-key M-c display-popup -E -w 85% -h 75% "PATH=/data/data/com.termux/files/usr/bin:/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-cheat"
bind-key M-e display-popup -E -w 80% -h 60% "PATH=/data/data/com.termux/files/usr/bin:/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-dotfiles"

# 9. Quick Pane Capture & Layout Rebalancer
bind-key Y run-shell "tmux capture-pane -p | termux-clipboard-set 2>/dev/null || tmux capture-pane -p | xclip -selection clipboard 2>/dev/null || tmux capture-pane -p | pbcopy 2>/dev/null" \; display-message "✓ Captured visible pane to clipboard"
bind-key = select-layout tiled


# ==============================================================================
# TPM PLUGIN CONFIGURATION
# ==============================================================================

# Core Plugin Repository Setup
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-logging'

# Resurrect Engine Adjustments
set -g @tmux-resurrect-capture-pane-contents 'on'
set -g @tmux-resurrect-processes 'ssh psql mysql sqlite3 tail top htop nvim claude agy agyy "~agy->agyy"'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Explicit fallback bindings for session save & restore
bind-key S run-shell 'LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH ~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "✓ Default Session State Saved"
bind-key R run-shell 'LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display-message "✓ Default Session State Restored"

# Custom Named Backup & Restore (Prompts for custom snapshot name)
bind-key C-s command-prompt -p "Save named backup as:" "run-shell 'LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 PATH=/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/bin:$HOME/.local/bin:$PATH $HOME/bin/tmux-save-named %1'"
bind-key C-r display-popup -E -w 75% -h 50% "zsh -ic '$HOME/bin/tmux-restore-named'"

# Auto-Restore Settings
set -g @tmux-continuum-restore 'on'

# tmux-logging — on-demand manual captures, all written to ~/tmux-logs.
# Toggle key is moved off its default 'P' (which our archive binding owns) to
# Alt-l, grouping it with the plugin's other Alt-based manual commands:
#   prefix + M-l  → toggle continuous logging of the current pane
#   prefix + M-p  → screen-capture the visible pane contents
#   prefix + M-P  → save the complete scrollback history
#   prefix + M-c  → clear the current pane's history
set -g @logging_key 'M-l'
set -g @logging-path             "$HOME/tmux-logs"
set -g @screen-capture-path      "$HOME/tmux-logs"
set -g @save-complete-history-path "$HOME/tmux-logs"

# Initialize TMUX plugin manager (Must remain the absolute final line of this file)
run '~/.tmux/plugins/tpm/tpm'
